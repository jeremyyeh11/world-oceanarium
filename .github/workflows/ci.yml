name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Setup Python for PNG tooling tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test lossless GLB tooling
        run: |
          python -m pip install Pillow==12.3.0
          python tests/glbPngOptimization.test.py

      - name: Build
        run: npm run build
