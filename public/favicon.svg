<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">World Oceanarium WO mola mola reference-clean icon</title>
  <desc id="desc">A cleaned vector WO mark following Jeremy's reference: white monogram and mola mola outline on blue circle.</desc>
  <defs>
    <radialGradient id="blue" cx="48%" cy="44%" r="70%">
      <stop offset="0%" stop-color="#1c5f9d"/>
      <stop offset="100%" stop-color="#12487d"/>
    </radialGradient>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="240"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="#05070b"/>
  <circle cx="256" cy="256" r="240" fill="url(#blue)"/>

  <g clip-path="url(#circleClip)">
    <!-- Outer mola + WO stroke, intentionally close to the supplied reference. -->
    <path d="M205 174
             C211 125 214 103 228 101
             C251 99 286 129 316 180
             C328 200 335 205 356 205
             C403 207 439 228 454 262
             C456 266 456 272 456 276
             C444 276 439 279 438 285
             C437 291 443 295 455 296
             C444 334 404 357 354 357
             C336 357 329 361 318 374
             C288 409 242 445 223 438
             C207 432 209 405 212 357
             C189 357 161 350 138 337
             C111 322 95 302 94 280
             C82 266 82 247 94 232
             C95 211 110 192 136 181
             C157 172 183 170 205 174Z"
          fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Left scalloped clavus / tail from the sketch, kept because this is what makes the reference recognizable. -->
    <path d="M123 200
             C99 204 83 223 82 245
             C72 258 73 278 85 291
             C87 317 109 338 141 349"
          fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Big O/body at right, with mouth notch + eye. -->
    <path d="M366 207
             C416 208 452 243 454 284
             C453 326 416 358 366 359
             C315 358 282 326 281 283
             C282 239 316 208 366 207Z"
          fill="none" stroke="#ffffff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M451 272 C436 272 431 278 431 285 C431 293 438 298 451 298" fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round"/>
    <circle cx="403" cy="268" r="8" fill="#ffffff"/>

    <!-- Central W: thick left diagonal, thin middle V, thick right stem; follows the hand-drawn reference. -->
    <path d="M169 190 L207 342" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
    <path d="M207 342 C223 302 239 255 239 231 C239 211 229 200 209 198" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M239 231 C251 271 263 310 279 342" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M279 342 L324 214" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
    <path d="M209 198 L239 198" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>

    <!-- Small connection from W to O lower curve, matching the reference's joined WO. -->
    <path d="M279 342 C288 326 296 304 304 283" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
